[Application]
app.classpath=$APPDIR/composeApp-jvm-1.6.11.jar
app.mainclass=org.tool.kit.MainKt

[JavaOptions]
java-options=-Djpackage.app-version=1.6.11
java-options=-Dcompose.application.resources.dir=$APPDIR/resources
java-options=-Dcompose.application.configure.swing.globals=true
java-options=-Djava.net.useSystemProxies=true
java-options=-Dorg.slf4j.simpleLogger.defaultLogLevel=INFO
java-options=-Dkotlin-logging-to-logback=true
java-options=-Dapp.log.dir=$APPDIR
java-options=-Dapp.log.env=release
java-options=-Dapple.awt.application.appearance=system
java-options=-Dskiko.library.path=$APPDIR
java-options=-Xdock:name=AndroidToolKit
